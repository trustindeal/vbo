<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VBONotif</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-page">
<div class="login-card">
<div class="logo">VBO<span>Notif</span></div>
<div class="login-subtitle">WhatsApp Messaging Platform</div>
<form id="loginForm">
<div class="form-group">
<label for="username">Username</label>
<input type="text" id="username" name="username" autocomplete="username" required>
</div>
<div class="form-group">
<label for="password">Password</label>
<div class="password-wrapper">
<input type="password" id="password" name="password" autocomplete="current-password" required>
<button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">&#128065;</button>
</div>
</div>
<div id="loginMessage" class="login-message"></div>
<button type="submit" id="loginButton">Login</button>
</form>
</div>
</div>
<script src="js/login.js"></script>
</body>
</html>
