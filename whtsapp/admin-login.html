<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBONotif Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 380px;
            max-width: 92%;
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-name {
            font-size: 30px;
            font-weight: 700;
        }

        .brand-name span {
            color: #16a34a;
        }

        .brand-subtitle {
            margin-top: 5px;
            color: #777;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8dee8;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 13px;
            display: none;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">
        <div class="brand-name">VBO<span>Notif</span></div>
        <div class="brand-subtitle">Admin Panel</div>
    </div>

    <form id="adminLoginForm">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

        <div id="loginError" class="error"></div>

    </form>

</div>

<script src="js/admin-login.js"></script>

</body>
</html>
