<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Kwikkwash Team · Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef4f8;color:#102a43;font-family:system-ui,sans-serif}.card{max-width:390px;padding:30px;text-align:center;background:#fff;border-radius:24px;box-shadow:0 20px 50px rgba(16,42,67,.14)}h1{margin:0 0 10px;font-size:25px}p{margin:0 0 20px;color:#627d98;line-height:1.5}button{padding:12px 20px;border:0;border-radius:12px;color:#fff;background:#102a43;font:700 14px system-ui;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <h1>You are offline</h1>
    <p>Reconnect to the internet to verify your team account and open the assigned workspace.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
