<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.5, user-scalable=yes">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="header"></header>

  <button class="logout-btn" onclick="logout()">Logout</button>

  <div class="container">

    <div class="tab-bar" id="tab-bar"></div>

    <div id="tab-contents"
         class="tab-contents"
         style="position: relative; width: 100%; flex-grow: 1; overflow: hidden;">

      <!-- HOME TAB -->
      <div id="home-content" class="tab-content active">

        <div class="right-grid">

          <!-- PREBOOKINGS -->
          <div>
            <div class="right-button btn-internet clickable"
                 onclick="openTab('https://kwikkwash.com/moradabadlaunch/dashboard', 'PreBookings')">
              PreBookings
            </div>
          </div>
          <!-- Customer app -->
          <div>
            <div class="right-button btn-internet clickable"
                 onclick="openTab('https://kwikkwash.com', 'PreBookings')">
              Customer app
            </div>
          </div>



          <!-- DASHBOARD -->
          <div>
            <div class="right-button btn-cable clickable"
                 onclick="openTab('https://kwikkwash.com/moradabadcp/', 'Dashboard')">
              Dashboard
            </div>
          </div>


          <!-- TEAM ACCESS -->
          <div>
            <div class="right-button btn-admin clickable"
                 onclick="toggleOptions(this)">
              Team Access
            </div>

            <div class="dropdown-options">

              <!-- 001 SURAPSINGH -->
              <div class="right-button btn-admin right-button-small clickable"
                   onclick="openTab('https://kwikkwash.com/rampur/employeeland/001surajpal', '001surajsingh')">
                001surajsingh
              </div>

              <!-- 003 LALSINGH -->
              <div class="right-button btn-admin right-button-small clickable"
                   onclick="openTab('https://kwikkwash.com/rampur/employeeland/003lalsingh', '003lalsingh')">
                003lalsingh
              </div>

            </div>
          </div>

        </div>

      </div>

    </div>
  </div>


  <div id="popupMessage">Coming soon</div>

  <audio id="errorSound"
         src="https://cdn.pixabay.com/audio/2022/03/15/audio_d9b5d6c2e8.mp3"
         preload="auto">
  </audio>


  <script>
    function showComingSoon() {
      const popup = document.getElementById('popupMessage');
      popup.style.display = 'block';

      setTimeout(() => {
        popup.style.display = 'none';
      }, 1200);
    }
  </script>

  <script src="functions.js"></script>

</body>
</html>
